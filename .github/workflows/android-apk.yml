name: APK Android de test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Construire l’APK de débogage
    runs-on: ubuntu-latest
    env:
      # L’APK de test sert actuellement à éprouver l’édition familiale Explorations.
      ATLAS_MOBILE_EDITION: explorations
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - run: ./android/gradlew -p android assembleDebug
      - uses: actions/upload-artifact@v6
        with:
          name: atlas-karst-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
